# Local development services. Ports are offset from the Moodle stack's so both
# can run side by side during migration.
name: kadsamhsa-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kadsamhsa
      POSTGRES_PASSWORD: kadsamhsa
      POSTGRES_DB: kadsamhsa
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kadsamhsa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches outbound mail locally so no development run can email a real learner.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1026:1025"
      - "8026:8025"

volumes:
  postgres_data:
  redis_data:
