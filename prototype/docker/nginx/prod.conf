# KADSAMHSA LMS — production vhost (behind the Caddy TLS edge proxy)
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php index.html;

    client_max_body_size 128M;

    # Behind a proxy on standard ports: emit relative redirects so Moodle
    # never leaks an internal host:port into a Location header.
    absolute_redirect off;
    port_in_redirect off;

    # Trust the Caddy container's address for the real client IP.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server_tokens off;

    # Branded KADSAMHSA 404 (Figma).
    error_page 404 /theme/kadsamhsa/error404.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass moodle-php:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # TLS terminates at Caddy; tell PHP the request was HTTPS so Moodle
        # (with $CFG->sslproxy = true) builds https:// URLs.
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param REQUEST_SCHEME https;

        fastcgi_read_timeout 300;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- Hardening: never serve these over the web ---
    location ~ /\. {
        deny all;
    }
    location ~* /(config|install|version)\.php\.dist$ {
        deny all;
    }
    location ~* \.(bak|old|orig|save|swp|sql|tgz|tar|gz|zip)$ {
        deny all;
    }
    # Moodle internal dirs that must never be web-served
    location ^~ /moodledata { deny all; }
    location ^~ /backup/     { deny all; }
    location ^~ /vendor/     { deny all; }
    location ^~ /node_modules/ { deny all; }
}
