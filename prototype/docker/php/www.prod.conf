[www]
; KADSAMHSA LMS — production PHP-FPM pool (loaded after zz-moodle.conf)
;
; Sizing rule of thumb: pm.max_children ~= (RAM available to PHP) / 80MB.
;   2 GB VPS  -> 12      4 GB VPS -> 30      8 GB VPS -> 60
; Edit this file and `docker compose ... restart moodle-php` after changing.
user = www-data
group = www-data
listen = 9000
pm = dynamic
pm.max_children = 30
pm.start_servers = 5
pm.min_spare_servers = 3
pm.max_spare_servers = 10
pm.max_requests = 500
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 300s
slowlog = /proc/self/fd/2
request_slowlog_timeout = 20s
